# cargo-deny configuration. Not enforced by the build; documents policy.
# License allowlist reflects audio-toolkit (BSD-2-Clause) + pure-Rust transitive
# deps (MIT / Apache-2.0 / MPL-2.0 / ISC / Zlib / Unicode-DFS-2016).

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "BSD-2-Clause",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSD-3-Clause",
]
copyleft = "warn"
default = "deny"

[duplicates]
warn = []

[bans]
multiple-versions = "warn"
highlight = "all"
